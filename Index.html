
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px 50px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
            position: relative;
            min-height: 200px;
        }

        h1 {
            color: #ff3366;
            margin-bottom: 40px;
            font-size: 26px;
        }

        .btn-container {
            display: flex;
            justify-content: space-around;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }

        #yes-btn {
            background-color: #ff3366;
            color: white;
            position: absolute;
            left: 20px;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }

        #no-btn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
            right: 20px;
        }

        #no-btn:hover {
            background-color: #d0d0d0;
        }

        /* Crying Screen Styles */
        #crying-screen {
            display: none;
            text-align: center;
        }

        .emoji {
            font-size: 90px;
            margin-bottom: 20px;
            animation: bounce 0.6s infinite alternate;
        }

        #crying-screen h2 {
            color: #555;
            font-size: 24px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Main Question Card -->
    <div class="card" id="main-card">
        <h1>Do you love me?</h1>
        <div class="btn-container">
            <button id="yes-btn" onmouseover="moveButton()" onclick="moveButton()">Yes</button>
            <button id="no-btn" onclick="showCryingScreen()">No</button>
        </div>
    </div>

    <!-- Crying Screen Card -->
    <div class="card" id="crying-screen">
        <div class="emoji">😭</div>
        <h2>Why would you click no?!</h2>
    </div>

    <script>
        function moveButton() {
            const yesBtn = document.getElementById('yes-btn');
            const card = document.getElementById('main-card');

            // Calculate random coordinates inside the card container
            const maxX = card.clientWidth - yesBtn.clientWidth - 40;
            const maxY = card.clientHeight - yesBtn.clientHeight - 40;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY) - 20;

            yesBtn.style.left = randomX + 'px';
            yesBtn.style.top = randomY + 'px';
        }

        function showCryingScreen() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('crying-screen').style.display = 'block';
        }
    </script>

</body>
</html>
